name: ci

on:
  push:
  pull_request:

env:
  VCPKG_COMMIT: 277978ad2eddc3b05ecf288dcd33071968cd2f79
  VCPKG_ROOT: /opt/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: /root/.cache/vcpkg/archives

jobs:
  cpp:
    name: cpp (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, ubuntu:26.04]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl zip unzip tar \
            pkg-config libtool python3 ca-certificates gpg

      # Ubuntu 24.04 ships CMake 3.28; the project is developed against 4.2.
      - name: Install a current CMake from Kitware's apt repository
        run: |
          current="$(cmake --version | sed -n '1s/.* //p')"
          if dpkg --compare-versions "$current" lt 4.2; then
            . /etc/os-release
            curl -fsSL https://apt.kitware.com/keys/kitware-archive-latest.asc \
              | gpg --dearmor -o /usr/share/keyrings/kitware-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ ${VERSION_CODENAME} main" \
              > /etc/apt/sources.list.d/kitware.list
            apt-get update
            apt-get install -y --no-install-recommends cmake
          fi
          cmake --version

      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg at the pinned baseline
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: /root/.cache/vcpkg/archives
          key: vcpkg-${{ matrix.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.image }}-

      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Unit tests
        run: ctest --preset dev -L unit

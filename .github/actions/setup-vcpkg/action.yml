name: Set up vcpkg
description: >-
  Clone vcpkg at the builtin-baseline of vcpkg.json, bootstrap it, export
  VCPKG_ROOT and VCPKG_DEFAULT_BINARY_CACHE for the steps that follow, and
  restore the binary archive cache. Run it after actions/checkout.
inputs:
  root:
    description: Directory to clone vcpkg into
    required: true
  binary-cache:
    description: vcpkg binary archive directory, cached between runs
    required: true
  cache-key:
    description: Cache key for the binary archives
    required: true
  restore-key:
    description: Key prefix to fall back to when cache-key misses
    required: true
  restore-only:
    description: >-
      'true' only restores the cache, and the caller saves it with
      actions/cache/save (for example also when the job fails). 'false'
      restores it and saves it at the end of a successful job.
    required: false
    default: 'false'
outputs:
  cache-hit:
    description: "'true' when the binary archives were restored from an exact cache-key match"
    value: ${{ steps.cache.outputs.cache-hit || steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The tool checkout and the manifest baseline are the same commit, so the
    # pin lives in one place: vcpkg.json.
    - name: Bootstrap vcpkg at the manifest baseline
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        BINARY_CACHE: ${{ inputs.binary-cache }}
      run: |
        baseline=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')
        git clone https://github.com/microsoft/vcpkg.git "$ROOT"
        git -C "$ROOT" checkout "$baseline"
        "$ROOT/bootstrap-vcpkg.sh" -disableMetrics
        mkdir -p "$BINARY_CACHE"
        echo "VCPKG_ROOT=$ROOT" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$BINARY_CACHE" >> "$GITHUB_ENV"

    - name: Cache vcpkg binary archives
      id: cache
      if: inputs.restore-only != 'true'
      uses: actions/cache@v4
      with:
        path: ${{ inputs.binary-cache }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.restore-key }}

    - name: Restore vcpkg binary archives
      id: restore
      if: inputs.restore-only == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.binary-cache }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.restore-key }}

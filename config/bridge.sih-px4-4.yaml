# Bridge configuration for the four-vehicle PX4 SIH simulation
# (sim/sih-px4-4). Instance N sends its offboard link to host UDP 14540+N
# with MAVLink system id N+1, and the bridge listens there, replies to whoever
# sent last and only accepts that system id.
dds: { domain_id: 42, partition: default }
gcs_sysid: 245
link: { degraded_gap_ms: 250, lost_gap_ms: 1000, degraded_loss_pct: 20, recover_healthy_ms: 500 }
rates: { pose_hz: 20, state_hz: 5, health_hz: 2 }
vehicles:
  - { id: 1, name: px4-0, link: "udp://0.0.0.0:14540", sysid: 1 }
  - { id: 2, name: px4-1, link: "udp://0.0.0.0:14541", sysid: 2 }
  - { id: 3, name: px4-2, link: "udp://0.0.0.0:14542", sysid: 3 }
  - { id: 4, name: px4-3, link: "udp://0.0.0.0:14543", sysid: 4 }
